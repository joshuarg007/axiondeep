customHeaders:
  - pattern: '**'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://api.site2crm.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://api.site2crm.io https://*.amazonaws.com; frame-src 'self' https://www.googletagmanager.com"
      - key: Cache-Control
        value: public, max-age=3600, s-maxage=86400
  - pattern: /
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /mission
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /development
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /research
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /research/*
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /careers
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /contact
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /privacy
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /legal
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: /projects/*
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: '*.html'
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: '**/*.html'
    headers:
      - key: Content-Type
        value: text/html; charset=utf-8
  - pattern: '**/*.{js,css}'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '**/*.{png,jpg,jpeg,gif,webp,svg,ico}'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
